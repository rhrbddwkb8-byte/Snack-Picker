<!DOCTYPE html>

<head>
<meta charset="UTF-8" />

<title>Snack Picker</title>

<style>
body {
  font-family: Arial, sans-serif;
  background: #f7f3ef;
  margin: 0;
  padding: 20px;
  color: #222;
}

.container {
  max-width: 800px;
  margin: auto;
  background: white;
  border-radius: 20px;
  padding: 24px;
  box-shadow: 0 4px 16px rgba(0,0,0,.12);
}

button {
  width: 100%;
  border: none;
  border-radius: 14px;
  padding: 14px;
  margin: 10px 0;
  font-size: 16px;
  cursor: pointer;
  background: #e7ddff;
}

button:hover {
  background: #d6c6ff;
}

.secondaryButton {
  background: #ececec;
}

.secondaryButton:hover {
  background: #ddd;
}

.option {
  text-align: left;
  margin: 10px 0;
}

.snack {
  background: #fff3c4;
  padding: 14px;
  border-radius: 14px;
  margin: 10px 0;
  cursor: pointer;
}

.snack:hover {
  background: #ffe99c;
}

.tags {
  font-size: 13px;
  opacity: .7;
  margin-top: 5px;
}

.helperText {
  font-size: 14px;
  color: #666;
  line-height: 1.5;
  margin-top: -6px;
  margin-bottom: 18px;
  padding-left: 12px;
}

.optionalSubtitle {
  display: inline-block;
  margin-top: -8px;
}

.historyBox {
  background: #f3f3f3;
  padding: 14px;
  border-radius: 14px;
  margin: 10px 0;
}
</style>
</head>

const sensoryOptions = [
  "Hard crunch",
  "Light crisp",
  "Soft",
  "Dense chewy",
  "Creamy/rich",
  "No chewing",
  "I'm not sure"
];

const extraOptions = [
  "Cold",
  "Warm",
  "Intense flavor",
  "Mild flavor",
  "Dry",
  "Nothing specific"
];

const prepOptions = [
  {
    value: "No effort",
    description: "open and immediately eat/drink"
  },
  {
    value: "Simple assembly",
    description: "toast, microwave, blend, combine; very few steps"
  },
  {
    value: "Active cooking",
    description: "multiple steps, coordination, active preparation"
  },
  {
    value: "Takeout / restaurant",
    description: "outside effort, no cooking"
  },
  {
    value: "Doesn't matter",
  }
];


const feelingOptions = [
  "Lonely",
  "Sad",
  "Overwhelmed",
  "Anxious",
  "Restless",
  "Bored",
  "Overstimulated",
  "Tired",
  "Frustrated",
  "Burdened",
  "Just hungry",
  "I'm not sure"
];

let sweetSavory = "";
let sensoryChoices = [];
let extraChoices = [];
let prepChoices = [];
let chosenSnack = "";

function showPage1() {
  document.getElementById("question").innerHTML =
    "<h2>Sweet or savory?</h2>";

  document.getElementById("answers").innerHTML = `
    <button onclick="chooseSweetSavory('Sweet')">Sweet</button>
    <button onclick="chooseSweetSavory('Savory')">Savory</button>
    <button onclick="chooseSweetSavory('Both')">Both</button>
    <button onclick="chooseSweetSavory('Not sure')">I'm not sure</button>
  `;

  document.getElementById("results").innerHTML = `
    <button class="secondaryButton" onclick="showHistory()">View history</button>
    <button class="secondaryButton" onclick="showPatterns()">View patterns</button>
  `;
}

function chooseSweetSavory(choice) {
  sweetSavory = choice;
  showPage2();
}

function showPage2() {
  document.getElementById("question").innerHTML =
  "<h2>What sounds good?</h2><p class='helperText'><em>✱ Select only <strong>must-haves</strong></em><br><em>✱ Leave anything optional unselected</em><br><em>✱ Multiple selections = all in one snack</em></p>";
  
  let html = "";

  sensoryOptions.forEach(option => {
    html += `
      <div class="option">
        <label>
          <input type="checkbox" name="sensory" value="${option}" ${sensoryChoices.includes(option) ? "checked" : ""}>

  html += `

    <button class="secondaryButton" onclick="showPage1()">← Back</button>
  `;

  document.getElementById("answers").innerHTML = html;
  document.getElementById("results").innerHTML = "";
}

function savePage2() {
  const checked = document.querySelectorAll('input[name="sensory"]:checked');
  sensoryChoices = Array.from(checked).map(item => item.value);
  showPage3();
}

}

function savePage3() {

  if (extraChoices.includes("Nothing specific")) {
    extraChoices = [];
  }

  showPage4();
}

function showPage4() {
document.getElementById("question").innerHTML =

  let html = "";

  prepOptions.forEach(option => {

      <div class="option">
        <label>
          <input type="checkbox" name="prep" value="${option.value}" ${prepChoices.includes(option.value) ? "checked" : ""}>

        </label>

  document.getElementById("results").innerHTML = "";
}

function savePage4() {
  const checked = document.querySelectorAll('input[name="prep"]:checked');
  prepChoices = Array.from(checked).map(item => item.value);

  if (prepChoices.includes("Doesn't matter")) {
    prepChoices = [];
  }

  showResults();
}

function scoreSnack(snack) {
  if (sweetSavory !== "Not sure") {
    if (sweetSavory === "Both" && !snack.sweetSavory.includes("Both")) {
      return -1;
    }

    if (
      sweetSavory !== "Both" &&
      !snack.sweetSavory.includes(sweetSavory) &&
      !snack.sweetSavory.includes("Both")
    ) {
      return -1;
    }
  }

  if (!sensoryChoices.includes("I'm not sure")) {
    for (let choice of sensoryChoices) {
      if (!snack.tags.includes(choice)) {
        return -1;
      }
    }

    if (
      !sensoryChoices.includes("Hard crunch") &&
      snack.tags.includes("Hard crunch")
    ) {
      return -1;
    }
  }

  for (let choice of extraChoices) {
    if (["Cold", "Warm", "Dry"].includes(choice) && !snack.tags.includes(choice)) {
      return -1;
    }

    if (choice === "Mild flavor" && !snack.tags.includes("Mild flavor")) {
      return -1;
    }

    if (choice === "Intense flavor" && !snack.tags.includes("Intense flavor")) {
      return -1;
    }
  }

if (prepChoices.length > 0) {
  const matchesPrep = prepChoices.some(choice =>
    snack.tags.includes(choice)
  );

  if (!matchesPrep) {
    return -1;
  }
}

  let score = 0;

  sensoryChoices.forEach(choice => {
    if (choice !== "I'm not sure" && snack.tags.includes(choice)) {
      score += 5;
    }
  });

  extraChoices.forEach(choice => {
    if (
      choice === "Mild flavor" &&
      snack.tags.includes("Mild flavor") &&
      !snack.tags.includes("Intense flavor")
    ) {
      score += 4;
    } else if (
      choice === "Intense flavor" &&
      snack.tags.includes("Intense flavor") &&
      !snack.tags.includes("Mild flavor")
    ) {
      score += 4;
    } else if (snack.tags.includes(choice)) {
      score += 1;
    }
  });

  return score;
}

function showResults() {
  const ranked = snacks
    .map(snack => ({ ...snack, score: scoreSnack(snack) }))
    .filter(snack => snack.score >= 0)
    .sort((a, b) => b.score - a.score);

  document.getElementById("question").innerHTML =
    "<h2>Possible snacks</h2>";

  let html = "";

  if (ranked.length === 0) {
    html += `<p>No matches found yet.</p>`;
  } else {
    ranked.forEach(snack => {
      html += `
        <div class="snack" onclick="chooseSnack('${snack.name}')">
          <strong>${snack.name}</strong>
          <div class="tags">${snack.tags.join(", ")}</div>
        </div>
      `;
    });
  }

  html += `
    <button class="secondaryButton" onclick="showPage4()">← Back</button>
    <button class="secondaryButton" onclick="restart()">Start over</button>
  `;

  document.getElementById("answers").innerHTML = "";
  document.getElementById("results").innerHTML = html;
}

function chooseSnack(name) {
  chosenSnack = name;

  document.getElementById("question").innerHTML =
    `<h2>${name}</h2><p>How are you feeling?</p>`;

  let html = "";

  feelingOptions.forEach(option => {
    html += `
      <div class="option">
        <label>
          <input type="checkbox" name="feeling" value="${option}">
          ${option}
        </label>
      </div>
    `;
  });

  html += `
    <button onclick="saveHistory()">Save</button>
    <button class="secondaryButton" onclick="showResults()">← Back</button>
  `;

  document.getElementById("answers").innerHTML = html;
  document.getElementById("results").innerHTML = "";
}

function saveHistory() {
  const checked = document.querySelectorAll('input[name="feeling"]:checked');
  let feelings = Array.from(checked).map(item => item.value);

  if (feelings.length === 0) {
    feelings = ["I'm not sure"];
  }

  const entry = {
    date: new Date().toLocaleString(),
    snack: chosenSnack,
    sweetSavory,
    sensoryChoices,
    extraChoices,
    prepChoices,
    feelings
  };

  let history = JSON.parse(localStorage.getItem("snackHistory")) || [];
  history.push(entry);
  localStorage.setItem("snackHistory", JSON.stringify(history));

  document.getElementById("question").innerHTML = "<h2>Saved!</h2>";
  document.getElementById("answers").innerHTML = `
    <button onclick="restart()">Start over</button>
    <button class="secondaryButton" onclick="showHistory()">View history</button>
  `;
  document.getElementById("results").innerHTML = "";
}

function showHistory() {
  const history = JSON.parse(localStorage.getItem("snackHistory")) || [];

  document.getElementById("question").innerHTML = "<h2>History</h2>";

  let html = "";

  if (history.length === 0) {
    html += `<p>No saved entries yet.</p>`;
  } else {
    history.slice().reverse().forEach(entry => {
      html += `
        <div class="historyBox">
          <strong>${entry.snack}</strong><br>
          ${entry.date}<br><br>
          Feelings: ${entry.feelings.join(", ")}<br>
          Sweet/Savory: ${entry.sweetSavory}<br>
          Sensory: ${entry.sensoryChoices.join(", ") || "—"}<br>
          Prep: ${entry.prepChoices ? entry.prepChoices.join(", ") : "—"}<br>
          Extras: ${entry.extraChoices.join(", ") || "—"}
        </div>
      `;
    });
  }

  html += `
    <button class="secondaryButton" onclick="restart()">Back to snack picker</button>
  `;

  document.getElementById("answers").innerHTML = "";
  document.getElementById("results").innerHTML = html;
}

function showPatterns() {
  const history = JSON.parse(localStorage.getItem("snackHistory")) || [];

  document.getElementById("question").innerHTML = "<h2>Patterns</h2>";
  document.getElementById("answers").innerHTML = "";

  let html = "";

  if (history.length === 0) {
    html += `<p>No saved entries yet.</p>`;
  } else {
    const byFeeling = {};
    const byTag = {};

    history.forEach(entry => {
      const snack = snacks.find(s => s.name === entry.snack);
      if (!snack) return;

      entry.feelings.forEach(feeling => {
        if (!byFeeling[feeling]) {
          byFeeling[feeling] = {
            total: 0,
            tags: {},
            snacks: {}
          };
        }

        byFeeling[feeling].total += 1;

        snack.tags.forEach(tag => {
          byFeeling[feeling].tags[tag] =
            (byFeeling[feeling].tags[tag] || 0) + 1;

          if (!byTag[tag]) {
            byTag[tag] = {
              total: 0,
              feelings: {},
              snacks: {}
            };
          }
        });

        byFeeling[feeling].snacks[snack.name] =
          (byFeeling[feeling].snacks[snack.name] || 0) + 1;
      });

      snack.tags.forEach(tag => {
        if (!byTag[tag]) {
          byTag[tag] = {
            total: 0,
            feelings: {},
            snacks: {}
          };
        }

        byTag[tag].total += 1;

        entry.feelings.forEach(feeling => {
          byTag[tag].feelings[feeling] =
            (byTag[tag].feelings[feeling] || 0) + 1;
        });

        byTag[tag].snacks[snack.name] =
          (byTag[tag].snacks[snack.name] || 0) + 1;
      });
    });

    html += `
      <button onclick="document.getElementById('byFeelingSection').style.display='block'; document.getElementById('bySensorySection').style.display='none';">
        By feeling
      </button>

      <button onclick="document.getElementById('byFeelingSection').style.display='none'; document.getElementById('bySensorySection').style.display='block';">
        By sensory need
      </button>
    `;

    html += `<div id="byFeelingSection" style="display:none;">`;
    html += `<h3>By feeling</h3>`;

    Object.keys(byFeeling).forEach(feeling => {
      const total = byFeeling[feeling].total;

      const topTags = Object.entries(byFeeling[feeling].tags)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      const topSnacks = Object.entries(byFeeling[feeling].snacks)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      html += `
        <div class="historyBox">
          <strong>${feeling}</strong><br><br>

          <em>Most common sensory needs:</em><br>
          ${topTags.map(([tag, count]) =>
            `${tag}: ${Math.round((count / total) * 100)}%`
          ).join("<br>")}

          <br><br>
          <em>Trending snacks:</em><br>
          ${topSnacks.map(([snack, count]) =>
            `${snack}: ${Math.round((count / total) * 100)}%`
          ).join("<br>")}
        </div>
      `;
    });

    html += `</div>`;

    html += `<div id="bySensorySection" style="display:none;">`;
    html += `<h3>By sensory need</h3>`;

    Object.keys(byTag).forEach(tag => {
      const total = byTag[tag].total;

      const topFeelings = Object.entries(byTag[tag].feelings)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      const topSnacks = Object.entries(byTag[tag].snacks)
        .sort((a, b) => b[1] - a[1])
        .slice(0, 3);

      html += `
        <div class="historyBox">
          <strong>${tag}</strong><br><br>

          <em>Most likely feelings behind it:</em><br>
          ${topFeelings.map(([feeling, count]) =>
            `${feeling}: ${Math.round((count / total) * 100)}%`
          ).join("<br>")}

          <br><br>
          <em>Common snacks:</em><br>
          ${topSnacks.map(([snack, count]) =>
            `${snack}: ${Math.round((count / total) * 100)}%`
          ).join("<br>")}
        </div>
      `;
    });

    html += `</div>`;
  }

  html += `
    <button class="secondaryButton" onclick="restart()">Back to snack picker</button>
  `;

  document.getElementById("results").innerHTML = html;
}

function restart() {
  sweetSavory = "";
  sensoryChoices = [];
  extraChoices = [];
  prepChoices = [];
  chosenSnack = "";
  showPage1();
}

showPage1();
